<!doctype html>
<!-- SPDX-License-Identifier: MIT -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pentomino boundary checks</title>
  </head>
  <body>
    <h1>Pentomino boundary checks</h1>
    <p>Serve the project over HTTP and open this page. These checks use the real
      Wasm solver and production renderer; no test framework is needed.</p>
    <p id="test-status" role="status" data-state="running">Running…</p>
    <pre id="results"></pre>
    <script type="module">
      const assert = (condition, message) => { if (!condition) throw new Error(message); };
      const piece = (text) => text.length === 1 && "FILPNTUVWXYZ".includes(text);
      const status = document.getElementById("test-status");
      const output = document.getElementById("results");
      const results = [];
      const cases = [
        ["Sat", "Oct", "31", "1,251"],
        ["Mon", "Jan", "1", "2,826"],
        ["Fri", "Jun", "30", "379"],
        ["Wed", "Feb", "29", "960"],
      ];
      try {
        const frame = document.createElement("iframe");
        frame.title = "Actual Calendar Puzzle under test";
        frame.style.height = "900px";
        frame.style.border = "0";
        const loaded = new Promise(resolve => frame.addEventListener("load", resolve, { once: true }));
        frame.src = "../index.html";
        document.body.append(frame);
        await loaded;
        const doc = frame.contentDocument;
        const appStatus = doc.getElementById("status");
        if (appStatus.dataset.state === "loading") {
          await new Promise(resolve => {
            const observer = new MutationObserver(() => {
              if (appStatus.dataset.state !== "loading") { observer.disconnect(); resolve(); }
            });
            observer.observe(appStatus, { attributes: true });
          });
        }
        assert(appStatus.dataset.state === "ready", appStatus.textContent);
        const weekday = doc.getElementById("weekday");
        const month = doc.getElementById("month");
        const day = doc.getElementById("day");
        const now = new Date();
        assert(weekday.selectedIndex === now.getDay() && month.selectedIndex === now.getMonth()
          && Number(day.value) === now.getDate(), "Initial date is not local date");
        const change = (element) => element.dispatchEvent(new frame.contentWindow.Event("change", { bubbles: true }));
        const coverage = new Set();
        for (const width of [800, 320]) {
          frame.style.width = `${width}px`;
          for (const [w, m, d, nodes] of cases) {
            weekday.value = w; change(weekday);
            month.value = m; change(month);
            day.value = d; change(day);
            doc.getElementById("solve").click();
            assert(appStatus.dataset.state === "success", appStatus.textContent);
            assert(appStatus.textContent.includes(`${nodes} search nodes`), "Search nodes changed");
            const grid = doc.getElementById("solution");
            const cells = [...grid.children];
            assert(cells.length === 63, "Wrong board size");
            const styles = cells.map(cell => frame.contentWindow.getComputedStyle(cell));
            const borders = styles.map(style => [style.borderTopWidth, style.borderRightWidth,
              style.borderBottomWidth, style.borderLeftWidth].map(parseFloat));
            const rectangle = grid.getBoundingClientRect();
            assert(Math.abs(rectangle.width / rectangle.height - 9 / 7) < 0.005, "Board is not 9:7");
            assert(doc.documentElement.scrollWidth <= width, "Horizontal page overflow");
            assert(["0px", "normal"].includes(frame.contentWindow.getComputedStyle(grid).gap), "Grid has gaps");
            assert(cells.filter(cell => cell.classList.contains("excluded")).length === 3, "Wrong exclusions");
            for (let i = 0; i < cells.length; i++) {
              const row = Math.floor(i / 9), column = i % 9;
              const box = cells[i].getBoundingClientRect();
              assert(Math.abs(box.width - box.height) < 0.1, "Cell is not square");
              assert(styles[i].outlineStyle === "none", "Extra outline doubles the border");
              for (const [outside, side] of [[row === 0, 0], [column === 8, 1], [row === 6, 2], [column === 0, 3]]) {
                if (outside) { assert(borders[i][side] === 2, "Outer border must be 2px"); coverage.add("outer"); }
              }
              if ((row === 0 || row === 6) && (column === 0 || column === 8)) coverage.add("corner");
              for (const [neighbor, side, opposite, direction] of [
                [column < 8 ? i + 1 : -1, 1, 3, "horizontal"],
                [row < 6 ? i + 9 : -1, 2, 0, "vertical"],
              ]) {
                if (neighbor < 0) continue;
                const same = piece(cells[i].textContent) && cells[i].textContent === cells[neighbor].textContent;
                const total = borders[i][side] + borders[neighbor][opposite];
                assert(total === (same ? 0 : 2), `${w} ${m} ${d}: wrong ${direction} boundary at cell ${i}`);
                if (same) {
                  assert(borders[i][side] === 0 && borders[neighbor][opposite] === 0, "Internal seam remains");
                  assert(styles[i].backgroundColor === styles[neighbor].backgroundColor, "Piece fill differs");
                } else {
                  assert(borders[i][side] === 1 && borders[neighbor][opposite] === 1, "Shared border is not evenly split");
                  assert(styles[i].borderColor === styles[neighbor].borderColor, "Outline colors differ");
                }
                coverage.add(`${direction}-${same ? "same" : "different"}`);
                if (!piece(cells[i].textContent) || !piece(cells[neighbor].textContent)) coverage.add("calendar");
                const other = cells[neighbor].getBoundingClientRect();
                assert(Math.abs(direction === "horizontal" ? box.right - other.left : box.bottom - other.top) < 0.001, "Gap between adjacent cells");
              }
            }
            results.push({ width, date: `${w} ${m} ${d}`, nodes, cells: cells.length });
            output.textContent += `PASS ${width}px — ${w} ${m} ${d}\n`;
          }
        }
        for (const name of ["horizontal-same", "horizontal-different", "vertical-same", "vertical-different", "calendar", "outer", "corner"]) {
          assert(coverage.has(name), `Required boundary case was not exercised: ${name}`);
        }
        window.boundaryTestResults = results;
        status.dataset.state = "passed";
        status.textContent = "PASS: all eight rendered solutions satisfy the boundary and geometry checks.";
      } catch (error) {
        status.dataset.state = "failed";
        status.textContent = `FAIL: ${error.message}`;
        output.textContent += error.stack;
        console.error(error);
      }
    </script>
  </body>
</html>
