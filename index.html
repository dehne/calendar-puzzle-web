<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Calendar Puzzle</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <main>
      <h1>Calendar Puzzle</h1>
      <p>Choose a date and cover the board with all twelve pentominoes.</p>
      <form id="date-form">
        <fieldset id="date-controls" disabled>
          <legend>Date to solve</legend>
          <div class="controls">
            <label>Weekday<select id="weekday" name="weekday"></select></label>
            <label>Month<select id="month" name="month"></select></label>
            <label>Day<select id="day" name="day"></select></label>
            <button id="solve" type="submit" disabled>Solve</button>
          </div>
        </fieldset>
      </form>
      <p id="status" role="status" aria-live="polite" data-state="loading">Loading solver and calendar layout…</p>
      <div id="solution" class="board" role="group" aria-label="Calendar puzzle board, 9 columns by 7 rows"></div>
      <p class="note">Weekday is independent of month and day. February always includes the 29th.</p>
      <noscript>JavaScript is required to load and run the Rust solver.</noscript>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
